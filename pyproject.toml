[project]
name = "qenvs"
description = "QEnvS: physically validated quantum control environments (quantum batteries, state transfer, open systems) for RL and optimal control, built on JAX + dynamiqs."
authors = [{ name = "Beomdo Park", email = "pbeomdo@gmail.com" }]
dynamic = ["version"]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["quantum control", "reinforcement learning", "quantum battery", "open quantum systems", "jax", "gymnasium"]
dependencies = [
    # jax<0.8: dynamiqs 0.3.6 fails to import with jax>=0.8 (UnionType | str in qarray.py).
    # Loosen once dynamiqs ships a fix.
    "jax>=0.4.36,!=0.7.0,!=0.7.1,<0.8",
    "dynamiqs>=0.3.6",
    "equinox",
    "numpy",
]

[project.scripts]
qenvs = "qenvs.cli:main"

[project.optional-dependencies]
gym = ["gymnasium>=1.0"]
dev = [
    "qenvs[gym]",
    "pytest>=8",
    "pytest-xdist",
    "ruff>=0.8",
    "codespell",
    "pre-commit",
    "qutip>=5",          # reference implementation for validation tests
]
docs = [
    "mkdocs-material",
    "mkdocstrings[python]",
    "mkdocs-gen-files",
    "mkdocs-literate-nav",
]

[project.urls]
Homepage = "https://github.com/beomdo-park/qenvs"
Documentation = "https://beomdo-park.github.io/qenvs"
Repository = "https://github.com/beomdo-park/qenvs"
Issues = "https://github.com/beomdo-park/qenvs/issues"

[build-system]
requires = ["hatchling>=1.25", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/qenvs/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/qenvs"]

[tool.hatch.build.targets.sdist]
include = ["src/qenvs", "tests", "README.md", "LICENSE", "NOTICE", "CITATION.cff"]

# --- tooling (ruff config adapted from dynamiqs, Apache-2.0) ---
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH", "NPY", "RUF", "D"]
ignore = ["D100", "D102", "D104", "D105", "D107", "D203", "D213", "E741", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["D", "ARG"]
"docs/**" = ["D"]
"examples/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.codespell]
skip = ".git,*.ipynb,uv.lock,site"
ignore-words-list = "ket,braket,sme"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
