site_name: QEnvS
site_description: Physically validated quantum control environments for RL and optimal control.
site_url: https://beomdo-park.github.io/QEnvS
repo_url: https://github.com/beomdo-park/QEnvS
repo_name: beomdo-park/QEnvS

theme:
  name: material
  logo: assets/qenvs_mark.png
  favicon: assets/favicon.png
  features: [navigation.sections, content.code.copy]
  palette:
    - scheme: default
      primary: indigo
      toggle: { icon: material/brightness-7, name: Dark mode }
    - scheme: slate
      primary: indigo
      toggle: { icon: material/brightness-4, name: Light mode }

plugins:
  - search
  - gen-files:
      scripts:
        - docs/gen_validation.py
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: false

markdown_extensions:
  - admonition
  - pymdownx.arithmatex: { generic: true }
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Models:
      - Qubit battery: models/qubit_battery.md
      - Dicke battery: models/dicke.md
      - Lambda system (STIRAP): models/lambda_system.md
  - Validation:
      - Validation report: validation.md
      - Review log: review-log.md
  - Benchmarks: benchmarks.md
  - Project:
      - Stability and versioning: stability.md
      - Roadmap: roadmap.md
  - API:
      - Models: api/models.md
      - Environments: api/envs.md
      - Wrappers: api/wrappers.md
