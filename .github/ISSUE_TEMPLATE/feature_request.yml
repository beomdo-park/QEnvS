name: Feature request
description: An API, wrapper, solver option or tooling improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The workflow or experiment, not only the proposed API.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or workarounds you tried
  - type: dropdown
    id: claim
    attributes:
      label: Who implements it?
      description: >-
        Claiming means you (or your agent) will open a draft PR soon. Changes to the public API,
        physics or a released task need an accepted design in docs/design/ first (AGENTS.md).
      options:
        - I will implement it (I claim this issue)
        - I would like someone else to
    validations:
      required: true
