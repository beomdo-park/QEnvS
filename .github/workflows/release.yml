# Publish to PyPI via Trusted Publishing (OIDC): no API tokens to store or rotate.
# One-time setup on PyPI (account sidebar -> Publishing -> GitHub):
#   project = qenvs, owner = beomdo-park, repo = QEnvS,
#   workflow = release.yml, environment = pypi
# Then: git tag v0.1.0 && git push --tags
name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # main takes only pull requests whose required checks passed on an up-to-date branch
      # (admins included), so a tag on main publishes tested code without a second CI run
      - name: the tagged commit must be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: astral-sh/setup-uv@v7
      # The version comes from the pushed tag: actions/checkout fetches that tag as a lightweight
      # one, so hatch-vcs would prefer another annotated tag on the same commit (the 0.3.2 build
      # first came out as 0.3.2rc1).
      - run: SETUPTOOLS_SCM_PRETEND_VERSION="${GITHUB_REF_NAME#v}" uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
      # Pre-releases (vX.Y.ZaN, bN, rcN) go to PyPI only. A GitHub release would make
      # Zenodo mint a permanent version DOI for a candidate, so only final tags get one.
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" =~ (a|b|rc)[0-9]+$ ]]; then
            echo "pre-release $TAG: PyPI only, no GitHub release"
          else
            gh release create "$TAG" dist/* --repo "${{ github.repository }}" --generate-notes
          fi
