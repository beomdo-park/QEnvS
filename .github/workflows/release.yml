# Publish to PyPI via Trusted Publishing (OIDC): no API tokens to store or rotate.
# One-time setup on PyPI (account sidebar -> Publishing -> GitHub):
#   project = qenvs, owner = beomdo-park, repo = QEnvS,
#   workflow = release.yml, environment = pypi
# Then: git tag v0.1.0 && git push --tags
name: release

on:
  push:
    tags: ["v*"]

jobs:
  # A tag publishes only a commit that main CI has already passed; rerun this job once it has.
  verify-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: require a successful ci run on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${{ github.sha }}&event=push&status=success" --jq .total_count)
          if [ "$count" -lt 1 ]; then
            echo "no successful ci run for ${{ github.sha }}"
            exit 1
          fi

  build:
    needs: verify-ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
      # Pre-releases (vX.Y.ZaN, bN, rcN) go to PyPI only. A GitHub release would make
      # Zenodo mint a permanent version DOI for a candidate, so only final tags get one.
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" =~ (a|b|rc)[0-9]+$ ]]; then
            echo "pre-release $TAG: PyPI only, no GitHub release"
          else
            gh release create "$TAG" dist/* --repo "${{ github.repository }}" --generate-notes
          fi
