name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run codespell src tests docs README.md
      - name: forbid typographic separators (middle dot, en/em dash)
        run: |
          ! LC_ALL=C.UTF-8 grep -rnIP --exclude-dir=assets '[\x{00B7}\x{2013}\x{2014}]' src tests docs examples README.md AGENTS.md CONTRIBUTING.md

  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }}${{ matrix.resolution == 'lowest-direct' && ', lowest deps' || '' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        resolution: [highest]
        include:
          - os: macos-latest
            python-version: "3.12"
            resolution: highest
          # oldest versions allowed by pyproject.toml (jax 0.4.36, numpy 1.26, qutip 5.1, ...)
          - os: ubuntu-latest
            python-version: "3.11"
            resolution: lowest-direct
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      - name: install (locked, newest allowed versions)
        if: matrix.resolution == 'highest'
        run: uv sync --extra dev
      - name: install (lowest allowed direct dependencies)
        if: matrix.resolution == 'lowest-direct'
        run: |
          uv venv
          uv pip install --resolution lowest-direct -e ".[dev]"
      - name: versions
        run: uv run --no-sync python -c "import sys, jax, dynamiqs, numpy, qutip; print(sys.version, jax.__version__, dynamiqs.__version__, numpy.__version__, qutip.__version__)"
      - run: uv run --no-sync pytest -n 4

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
