name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

# Scheduled and manual runs get their own group, so they do not replace a pending push run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run codespell src tests docs README.md
      - name: forbid typographic separators (middle dot, en/em dash)
        run: |
          ! LC_ALL=C.UTF-8 grep -rnIP --exclude-dir=assets '[\x{00B7}\x{2013}\x{2014}]' src tests docs examples README.md AGENTS.md CONTRIBUTING.md

  test:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    name: test (${{ matrix.os }}, py${{ matrix.python-version }}${{ matrix.resolution == 'lowest-direct' && ', lowest deps' || '' }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        resolution: [highest]
        include:
          - os: macos-latest
            python-version: "3.12"
            resolution: highest
          # oldest versions allowed by pyproject.toml (jax 0.4.36, numpy 1.26, qutip 5.1, ...)
          - os: ubuntu-latest
            python-version: "3.11"
            resolution: lowest-direct
    env:
      UV_PYTHON: ${{ matrix.python-version }}
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install ${{ matrix.python-version }}
      - name: install (locked dependencies)
        if: matrix.resolution == 'highest'
        run: uv sync --extra dev
      - name: install (lowest allowed direct dependencies)
        if: matrix.resolution == 'lowest-direct'
        run: |
          uv venv
          uv pip install --resolution lowest-direct -e ".[dev]"
      - name: versions
        run: uv run --no-sync python -c "import sys, jax, dynamiqs, numpy, qutip; print(sys.version, jax.__version__, dynamiqs.__version__, numpy.__version__, qutip.__version__)"
      # 3 workers: the runner has 16 GB; the full suite peaks at about 12.6 GB with 3 workers
      # (tests/conftest.py clears jax caches after each module)
      - run: uv run --no-sync pytest -n 3

  test-float32:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    name: float32 validation (ubuntu-latest, py3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UV_PYTHON: "3.12"
      JAX_PLATFORMS: cpu
      JAX_ENABLE_X64: "0"
      QENVS_TEST_X64: "0"
      QENVS_TEST_CPUS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --extra dev
      - name: versions and precision
        run: uv run --no-sync python -c "import sys, jax, dynamiqs, numpy, qutip; print(sys.version, jax.__version__, dynamiqs.__version__, numpy.__version__, qutip.__version__, jax.config.jax_enable_x64); assert not jax.config.jax_enable_x64"
      - run: uv run --no-sync pytest tests/test_validation.py tests/test_alpha_precision.py

  test-newest-dependencies:
    name: newest dependencies (ubuntu-latest, py3.12)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      UV_PYTHON: "3.12"
      JAX_PLATFORMS: cpu
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv python install 3.12
      - name: install newest allowed dependencies
        run: uv sync --upgrade --extra dev
      - name: versions
        run: uv run --no-sync python -c "import sys, jax, dynamiqs, numpy, qutip; print(sys.version, jax.__version__, dynamiqs.__version__, numpy.__version__, qutip.__version__)"
      - run: uv run --no-sync pytest -n 3

  build:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - run: uv build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7
